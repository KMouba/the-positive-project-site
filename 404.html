<title>the POSITIVE project</title>
<link rel="icon" type="image/png" href="/assets/logo-tpp.png">
<script>
  // Les anciennes adresses de l'application (the-positive-project.com/login, /admin/…)
  // vivent désormais sur app.the-positive-project.com : on y renvoie, même chemin.
  // Une page du site mal tapée (.html, /assets) reste ici.
  (function () {
    var p = window.location.pathname;
    if (!/\.html$/.test(p) && p.indexOf('/assets/') !== 0) {
      window.location.replace('https://app.the-positive-project.com' + p + window.location.search + window.location.hash);
    }
  })();
</script>
